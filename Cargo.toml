[package]
name = "pact"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.9"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
arboard = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
glob = "0.3"
regex = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Prevent eprintln! macros (corrupts TUI) - use status bar or logging instead
print_stderr = "deny"
print_stdout = "deny"
dbg_macro = "deny"
